openapi: 3.0.3
info: {title: Orders API, version: 1.0.0}
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {description: Bad request}
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        customerId: {type: string}
        channel: {type: string, enum: [WEB, STORE]}
        items: {type: array}
    OrderResponse:
      type: object
      properties:
        orderId: {type: string}
        status: {type: string, enum: [CREATED, CONFIRMED]}
        legacyCode: {type: string}
